<svg width="1120" height="620" viewBox="0 0 1120 620" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Only-One-Memory L0 to L3 semantic memory pyramid">
  <defs>
    <linearGradient id="p1" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#7DD3FC"/><stop offset="1" stop-color="#38BDF8"/></linearGradient>
    <linearGradient id="p2" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#A5B4FC"/><stop offset="1" stop-color="#818CF8"/></linearGradient>
    <linearGradient id="p3" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#C4B5FD"/><stop offset="1" stop-color="#A78BFA"/></linearGradient>
    <linearGradient id="p4" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#F0ABFC"/><stop offset="1" stop-color="#C084FC"/></linearGradient>
    <filter id="shadow" x="-10%" y="-20%" width="120%" height="140%"><feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#0F172A" flood-opacity="0.16"/></filter>
  </defs>
  <rect width="1120" height="620" rx="28" fill="#F8FAFC"/>
  <text x="560" y="58" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans CJK SC', sans-serif" font-size="34" font-weight="850" fill="#0F172A">OOM 记忆分层：低层保留证据，高层保留结构</text>
  <text x="560" y="96" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans CJK SC', sans-serif" font-size="18" fill="#475569">从原始事件到稳定画像，所有抽象都能沿 evidence_ref 下钻回 L0。</text>

  <g transform="translate(185 132)" filter="url(#shadow)">
    <path d="M375 0 L493 90 H257 Z" fill="url(#p4)"/>
    <path d="M257 100 H493 L607 190 H143 Z" fill="url(#p3)"/>
    <path d="M143 200 H607 L724 292 H26 Z" fill="url(#p2)"/>
    <path d="M26 302 H724 L750 410 H0 Z" fill="url(#p1)"/>

    <g font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans CJK SC', sans-serif" text-anchor="middle" fill="#0F172A">
      <text x="375" y="47" font-size="24" font-weight="850">L3 Persona</text>
      <text x="375" y="73" font-size="15" font-weight="600">稳定画像 / 长期偏好 / 交互协议</text>
      <text x="375" y="147" font-size="24" font-weight="850">L2 Scenario</text>
      <text x="375" y="173" font-size="15" font-weight="600">项目场景 / 生活主题 / 任务背景</text>
      <text x="375" y="251" font-size="24" font-weight="850">L1 Atom</text>
      <text x="375" y="277" font-size="15" font-weight="600">persona / episodic / instruction 原子记忆</text>
      <text x="375" y="355" font-size="24" font-weight="850">L0 Conversation</text>
      <text x="375" y="382" font-size="15" font-weight="600">原始对话 / 工具调用 / 工具结果 / 运行事件</text>
    </g>
  </g>

  <g transform="translate(825 174)" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans CJK SC', sans-serif">
    <rect width="238" height="64" rx="16" fill="#FFFFFF" stroke="#CBD5E1"/>
    <text x="20" y="28" font-size="16" font-weight="800" fill="#0F172A">Recall</text>
    <text x="20" y="49" font-size="14" fill="#64748B">Persona → Scene → Atom</text>
    <path d="M50 74 V128" stroke="#94A3B8" stroke-width="2" stroke-dasharray="6 6"/>
    <rect y="138" width="238" height="64" rx="16" fill="#FFFFFF" stroke="#CBD5E1"/>
    <text x="20" y="166" font-size="16" font-weight="800" fill="#0F172A">Trace</text>
    <text x="20" y="187" font-size="14" fill="#64748B">evidence_ref → L0 原文</text>
    <path d="M50 212 V266" stroke="#94A3B8" stroke-width="2" stroke-dasharray="6 6"/>
    <rect y="276" width="238" height="64" rx="16" fill="#FFFFFF" stroke="#CBD5E1"/>
    <text x="20" y="304" font-size="16" font-weight="800" fill="#0F172A">Update</text>
    <text x="20" y="325" font-size="14" fill="#64748B">merge / conflict / skip</text>
  </g>
</svg>
